# Appended to the source-locked upstream certify-default.properties.
# A standalone, isolated AS with the built-in cached-claims data provider.
spring.cloud.config.enabled=false
spring.cloud.bootstrap.enabled=false
spring.profiles.active=default
spring.datasource.url=jdbc:postgresql://certify-db:5432/inji_certify?currentSchema=certify
spring.datasource.username=postgres
spring.datasource.password=local-certify-only
mosip.certify.domain.url=https://certify.conformance.test:8443
mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.authorization.default-server=${mosip.certify.authorization.url}
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}
mosip.certify.authn.jwk-set-uri=${mosip.certify.domain.url}/v1/certify/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}/v1/certify/issuance/credential' }
mosip.certify.oauth.issuer=${mosip.certify.authorization.url}
mosip.certify.oauth.token-endpoint=${mosip.certify.domain.url}/v1/certify/oauth/token
mosip.certify.oauth.jwks-uri=${mosip.certify.authn.jwk-set-uri}
mosip.certify.oauth.interactive-authorization-endpoint=${mosip.certify.domain.url}/v1/certify/oauth/iae
# OAuthController implements both grants. Keep discovery aligned with the service.
mosip.certify.oauth.grant-types-supported=authorization_code,urn:ietf:params:oauth:grant-type:pre-authorized_code
mosip.certify.oauth.require-interactive-authorization-request=false
mosip.certify.credential-offer-url=${mosip.certify.domain.url}/v1/certify/credential-offer-data/
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.scan-base-package=io.mosip.certify.plugin.impl
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.data-provider-plugin.did-url=did:web:certify.conformance.test%3A8443
mosip.certify.data-provider-plugin.rendering-template-id=
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://certify.conformance.test:8443/credentials/
mosip.certify.credential-config.issuer.display={{'name': 'Local Conformance Issuer', 'locale': 'en'}}
mosip.certify.vp-request.config-file-url=https://certify.conformance.test:8443/vp_request_config.json
mosip.kernel.keymanager.hsm.config-path=/keys/local.p12
mosip.kernel.keymanager.hsm.keystore-pass=local-conformance-only
mosip.kernel.keymanager.signature.kid.prepend=
inji.did.verify.uri=did:web:certify.conformance.test%3A8443
inji.did.verify.public.key.uri=did:web:certify.conformance.test%3A8443#key-0
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER
server.forward-headers-strategy=framework
