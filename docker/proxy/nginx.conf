worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Ssl-Cipher $ssl_cipher;
    proxy_set_header X-Ssl-Protocol $ssl_protocol;
    proxy_set_header X-Ssl-Cert $ssl_client_cert;
    proxy_set_header Forwarded "for=$remote_addr;host=$http_host;proto=$scheme";

    # Docker's resolver plus variable upstreams allow component-only execution.
    # nginx must not fail config loading when the other app profile is absent.
    resolver 127.0.0.11 ipv6=off valid=10s;
    server {
        listen 8443 ssl;
        server_name certify.conformance.test;
        set $certify http://certify:8090;
        location = /.well-known/openid-credential-issuer {
            proxy_pass $certify/v1/certify/.well-known/openid-credential-issuer;
        }
        location = /.well-known/oauth-authorization-server {
            proxy_pass $certify/v1/certify/.well-known/oauth-authorization-server;
        }
        location = /.well-known/jwks.json {
            proxy_pass $certify/v1/certify/.well-known/jwks.json;
        }
        location = /.well-known/did.json {
            proxy_pass $certify/v1/certify/.well-known/did.json;
        }
        location = /vp_request_config.json { alias /config/vp_request_config.json; }
        location = /credentials/conformance {
            default_type application/json;
            alias /config/certify-sdjwt-type.json;
        }
        location /v1/certify/ { proxy_pass $certify$request_uri; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name verify.conformance.test;
        set $verify http://verify:8080;
        location / { proxy_pass $verify$request_uri; }
    }
    server {
        listen 8443 ssl;
        server_name oidf.conformance.test;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;
        set $suite http://oidf:8080;
        location / {
            # Same wrong-port signal as the upstream nginx configuration.
            set $wrong_mtls_host "";
            if ($request_uri ~* "^/test-mtls") { set $wrong_mtls_host "true"; }
            proxy_set_header X-Test-Mtls-Called-On-Wrong-Host $wrong_mtls_host;
            # Location-level proxy_set_header requires restating inherited headers.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cert $ssl_client_cert;
            proxy_pass $suite$request_uri;
        }
    }
    # Internal-only, matching upstream optional_no_ca behavior. No mTLS protocol
    # variant is claimed by Phase 1; this keeps the advertised base port valid.
    server {
        listen 8444 ssl;
        server_name oidf.conformance.test;
        ssl_verify_client optional_no_ca;
        set $suite http://oidf:8080;
        location / { proxy_pass $suite$request_uri; }
    }
}
